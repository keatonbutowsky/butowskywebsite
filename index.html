<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b0c" />
<meta name="description" content="The Butowsky family. Three generations. One name. Plano, Texas." />

<title>Butowsky</title>

<!-- View transitions for cross-document navigation (Chrome 126+) -->
<meta name="view-transition" content="same-origin" />

<!-- Fonts: Fraunces (variable serif) + Inter Tight (variable sans). Self-hosted via Google Fonts CDN with subsetting. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..700,30..100,0..1;1,9..144,200..700,30..100,0..1&family=Inter+Tight:wght@200..700&display=swap" />

<link rel="preload" as="image" href="img/hero/family-1920.webp" type="image/webp" fetchpriority="high" />
<link rel="stylesheet" href="css/main.css" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0b0c'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='40' fill='%23f3efe8'%3EB%3C/text%3E%3C/svg%3E" />
</head>
<body>

<!-- Top corner rule -->
<div class="top-rule">
  <span><b>Butowsky</b></span>
  <span>Plano, TX &middot; Est. 1991</span>
</div>

<!-- HERO -->
<header class="hero">
  <div class="hero-photo">
    <picture>
      <source type="image/webp" srcset="
        img/hero/family-1280.webp 1280w,
        img/hero/family-1920.webp 1920w,
        img/hero/family-2000.webp 2000w" sizes="100vw" />
      <img src="img/hero/family-1920.jpg" alt="The Butowsky family on the beach." width="1920" height="1384" />
    </picture>
  </div>

  <h1 class="hero-wordmark" aria-label="Butowsky"></h1>

  <div class="hero-meta">
    <span class="left">Six people<br/>Three generations<br/>One name</span>
    <span class="center">A family record</span>
    <span class="right">Recorded on the<br/>Gulf Coast,<br/>Spring 2025</span>
  </div>

  <span class="scroll-rail" aria-hidden="true"></span>
</header>

<!-- INTERLUDE: photo->type transition -->
<section class="interlude" aria-hidden="true">
  <div class="interlude-stage">
    <p class="interlude-quote">
      Some families are <em>built</em>.<br/>This one was <em>chosen</em> &mdash; six times.
    </p>
  </div>
</section>

<!-- TREE -->
<section class="tree-section">
  <span class="tree-eyebrow">&mdash; The Family &mdash;</span>

  <div class="tree" id="tree">
    <span class="gen-marker gen-i">I.</span>
    <span class="gen-marker gen-ii">II.</span>
    <span class="gen-marker gen-iii">III.</span>

    <svg class="tree-svg" id="treeSvg" aria-hidden="true"></svg>

    <!-- Generation 1 -->
    <div class="row-1">
      <button class="member ed" data-id="ed" aria-label="View bio: Ed Butowsky">
        <span class="member-portrait" style="--vt: portrait-ed;">
          <picture>
            <source type="image/webp" srcset="img/portraits/ed-320.webp 320w, img/portraits/ed-640.webp 640w, img/portraits/ed-1024.webp 1024w" sizes="200px" />
            <img src="img/portraits/ed-640.jpg" alt="Ed Butowsky" width="640" height="800" loading="lazy" />
          </picture>
        </span>
        <span class="member-name">Ed Butowsky</span>
        <span class="member-meta">b. 1962</span>
      </button>

      <button class="member dani" data-id="dani" aria-label="View bio: Dani Butowsky">
        <span class="member-portrait" style="--vt: portrait-dani;">
          <picture>
            <source type="image/webp" srcset="img/portraits/dani-320.webp 320w, img/portraits/dani-640.webp 640w, img/portraits/dani-1024.webp 1024w" sizes="200px" />
            <img src="img/portraits/dani-640.jpg" alt="Dani Butowsky" width="640" height="800" loading="lazy" />
          </picture>
        </span>
        <span class="member-name">Dani Butowsky</span>
        <span class="member-meta">b. 1964</span>
      </button>
    </div>

    <!-- Generation 2 -->
    <div class="row-2">
      <button class="member lauren" data-id="lauren" aria-label="View bio: Lauren Sheppard">
        <span class="member-portrait" style="--vt: portrait-lauren;">
          <picture>
            <source type="image/webp" srcset="img/portraits/lauren-320.webp 320w, img/portraits/lauren-640.webp 640w, img/portraits/lauren-1024.webp 1024w" sizes="200px" />
            <img src="img/portraits/lauren-640.jpg" alt="Lauren Sheppard" width="640" height="800" loading="lazy" />
          </picture>
        </span>
        <span class="member-name">Lauren Sheppard</span>
        <span class="member-meta">b. 1995</span>
      </button>

      <button class="member keaton" data-id="keaton" aria-label="View bio: Keaton Butowsky">
        <span class="member-portrait" style="--vt: portrait-keaton;">
          <picture>
            <source type="image/webp" srcset="img/portraits/keaton-320.webp 320w, img/portraits/keaton-640.webp 640w, img/portraits/keaton-1024.webp 1024w" sizes="200px" />
            <img src="img/portraits/keaton-640.jpg" alt="Keaton Butowsky" width="640" height="800" loading="lazy" />
          </picture>
        </span>
        <span class="member-name">Keaton Butowsky</span>
        <span class="member-meta">b. 1998</span>
      </button>
    </div>

    <!-- Generation 3 (spouses) -->
    <div class="row-3">
      <button class="member ben" data-id="ben" aria-label="View bio: Ben Sheppard">
        <span class="member-portrait" style="--vt: portrait-ben;">
          <picture>
            <source type="image/webp" srcset="img/portraits/ben-320.webp 320w, img/portraits/ben-640.webp 640w, img/portraits/ben-1024.webp 1024w" sizes="200px" />
            <img src="img/portraits/ben-640.jpg" alt="Ben Sheppard" width="640" height="800" loading="lazy" />
          </picture>
        </span>
        <span class="member-name">Ben Sheppard</span>
        <span class="member-meta">b. 1994</span>
      </button>

      <button class="member megan" data-id="megan" aria-label="View bio: Megan Williams">
        <span class="member-portrait" style="--vt: portrait-megan;">
          <picture>
            <source type="image/webp" srcset="img/portraits/megan-320.webp 320w, img/portraits/megan-640.webp 640w, img/portraits/megan-1024.webp 1024w" sizes="200px" />
            <img src="img/portraits/megan-640.jpg" alt="Megan Williams" width="640" height="800" loading="lazy" />
          </picture>
        </span>
        <span class="member-name">Megan Williams</span>
        <span class="member-meta">b. 2000</span>
      </button>
    </div>

    <!-- Relationship labels positioned by JS along connector midpoints -->
    <span class="rel-label" data-rel="ed-dani">Married 1991</span>
    <span class="rel-label" data-rel="lauren-ben">Married 2024</span>
    <span class="rel-label" data-rel="keaton-megan">Will marry 2026</span>
  </div>
</section>

<!-- SIGNATURE -->
<footer class="signature">
  <div class="sig-mono" aria-hidden="true">B</div>
  <p class="sig-line">Butowsky.</p>
  <p class="sig-meta">Plano, Texas &middot; Est. 1991</p>
</footer>

<!-- BIO PANEL (overlay, hash-routed) -->
<aside class="bio" id="bio" role="dialog" aria-modal="true" aria-labelledby="bioName" hidden>
  <div class="bio-portrait">
    <picture id="bioImg"></picture>
  </div>
  <div class="bio-content">
    <span class="bio-eyebrow" id="bioRole"></span>
    <h2 class="bio-name" id="bioName"></h2>
    <p class="bio-tagline" id="bioTagline"></p>
    <div class="bio-body" id="bioBody"></div>
    <div class="bio-links" id="bioLinks"></div>
  </div>
  <button class="bio-close" id="bioClose" aria-label="Close">&times;</button>
</aside>

<!-- Custom cursor (desktop, fine pointer only) -->
<div class="cursor" id="cursor" aria-hidden="true"></div>
<div class="cursor-label" id="cursorLabel" aria-hidden="true"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
